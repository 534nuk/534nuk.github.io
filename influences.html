<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Artists and bands that influence 534N UK">
    <meta name="theme-color" content="#090909">
    <meta name="robots" content="noindex, nofollow">
    <title>Influences · 534N UK</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <style>
      :root {
        color-scheme: dark;
        background: #090909;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #090909;
        color: #eee;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(72rem, 100%);
        margin-inline: auto;
        padding-bottom: 5rem;
      }

      .hero {
        position: relative;
        margin-bottom: 4.5rem;
      }

      .cover {
        display: block;
        width: 100%;
        aspect-ratio: 6.45 / 1;
        object-fit: cover;
        object-position: center;
      }

      .logo-link {
        position: absolute;
        bottom: -2.4rem;
        left: clamp(1.25rem, 4vw, 3rem);
        display: block;
        width: clamp(8rem, 16vw, 11.2rem);
        aspect-ratio: 1;
        border: 0.4rem solid #090909;
        border-radius: 50%;
        overflow: hidden;
      }

      .logo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .content {
        width: min(64rem, calc(100% - 2rem));
        margin-inline: auto;
      }

      h1 {
        margin: 0 0 2.5rem;
        color: #fff;
        font-size: clamp(2.25rem, 6vw, 5rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.95;
        text-transform: uppercase;
      }

      .influences {
        padding: 0;
        margin: 0;
        columns: 4 13rem;
        column-gap: 2.5rem;
        list-style: none;
      }

      .influences li {
        break-inside: avoid;
        padding: 0.45rem 0;
        border-bottom: 1px solid #242424;
        color: #cfcfcf;
        font-size: 1rem;
        line-height: 1.35;
      }

      .status {
        color: #888;
        font-size: 1rem;
      }

      @media (max-width: 32rem) {
        .hero {
          margin-bottom: 3.75rem;
        }

        .cover {
          aspect-ratio: 3.8 / 1;
        }

        .logo-link {
          bottom: -2rem;
          width: 6.8rem;
          border-width: 0.3rem;
        }

        h1 {
          margin-bottom: 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <img class="cover" src="assets/cover.jpg" alt="White audio waveforms on a dark background">
        <a class="logo-link" href="index.html" aria-label="Return to 534N UK home">
          <img class="logo" src="assets/logo.png" alt="">
        </a>
      </header>
      <section class="content" aria-labelledby="page-title">
        <h1 id="page-title">Influences</h1>
        <p class="status" id="status">Loading artists…</p>
        <ul class="influences" id="influences" hidden></ul>
      </section>
    </main>
    <script>
      const list = document.querySelector("#influences");
      const status = document.querySelector("#status");

      fetch("influences.txt")
        .then((response) => {
          if (!response.ok) throw new Error("Unable to load influences");
          return response.text();
        })
        .then((text) => {
          const artists = [...new Set(
            text.split(/\r?\n/).map((name) => name.trim()).filter(Boolean)
          )].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));

          const fragment = document.createDocumentFragment();
          artists.forEach((artist) => {
            const item = document.createElement("li");
            item.textContent = artist;
            fragment.appendChild(item);
          });

          list.appendChild(fragment);
          list.hidden = false;
          status.remove();
        })
        .catch(() => {
          status.textContent = "The influences list could not be loaded.";
        });
    </script>
  </body>
</html>
