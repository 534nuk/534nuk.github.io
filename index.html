<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="534N UK">
    <meta name="theme-color" content="#ffffff">
    <title>534N UK</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23111111'/%3E%3Cpath d='M18 22h28v5H25v5h17v5H25v5h21v5H18z' fill='white'/%3E%3C/svg%3E">
    <style>
      :root {
        color-scheme: light;
        background: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: 1rem;
        background: #fff;
      }

      main {
        display: grid;
        width: min(34rem, calc(100vw - 2rem));
        justify-items: center;
        gap: 2rem;
      }

      .logo {
        display: block;
        width: clamp(8rem, 18vw, 12rem);
        height: auto;
      }

      .player {
        display: block;
        width: 100%;
        height: 10.375rem;
        border: 0;
      }

      @media (max-width: 32rem) {
        .logo {
          width: clamp(7rem, 34vw, 10rem);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="assets/logo.png" alt="534N UK">
      <iframe
        class="player"
        title="The Grand Disaster by 534N UK on SoundCloud"
        src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/2407630428&amp;color=%23111111&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=false"
        allow="autoplay"
        loading="lazy"
      ></iframe>
    </main>
  </body>
</html>
