<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="534N UK">
    <meta name="theme-color" content="#090909">
    <title>534N UK</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23111111'/%3E%3Cpath d='M18 22h28v5H25v5h17v5H25v5h21v5H18z' fill='white'/%3E%3C/svg%3E">
    <style>
      :root {
        color-scheme: dark;
        background: #090909;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        overflow-y: auto;
        background: #090909;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        display: grid;
        width: min(72rem, 100%);
        margin-inline: auto;
        padding-bottom: 4rem;
      }

      .hero {
        position: relative;
        margin-bottom: 4rem;
        overflow: visible;
      }

      .cover {
        display: block;
        width: 100%;
        aspect-ratio: 6.45 / 1;
        object-fit: cover;
        object-position: center;
      }

      .logo {
        position: absolute;
        bottom: -3rem;
        left: clamp(1.25rem, 4vw, 3rem);
        display: block;
        width: clamp(10rem, 20vw, 14rem);
        aspect-ratio: 1;
        object-fit: cover;
        border: 0.4rem solid #090909;
        border-radius: 50%;
      }

      .content {
        display: grid;
        width: min(56rem, calc(100% - 2rem));
        gap: 3rem;
        margin-inline: auto;
      }

      section {
        display: grid;
        gap: 1rem;
      }

      h2 {
        margin: 0;
        color: #d7d7d7;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .player-frame {
        width: 100%;
        height: 12.5rem;
        overflow: hidden;
      }

      .player {
        display: block;
        width: 100%;
        height: 12.5rem;
        border: 0;
      }

      .tracks {
        display: grid;
        width: 100%;
        gap: 1rem;
      }

      @media (max-width: 32rem) {
        .hero {
          margin-bottom: 3.25rem;
        }

        .cover {
          aspect-ratio: 3.8 / 1;
        }

        .logo {
          bottom: -2.5rem;
          width: 8.5rem;
          border-width: 0.3rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <img class="cover" src="assets/cover.jpg" alt="White audio waveforms on a dark background">
        <img class="logo" src="assets/logo.png" alt="534N UK">
      </header>
      <div class="content">
        <section aria-labelledby="featured-heading">
          <h2 id="featured-heading">Featured</h2>
          <div class="player-frame">
            <iframe class="player" title="Don't Do That Now by 534N UK on SoundCloud" width="100%" height="200" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%3Atracks%3A2408106624%3Fsecret_token%3Ds-GTGbddL1rf1&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=false&amp;visual=true"></iframe>
          </div>
        </section>
        <section aria-labelledby="spotlight-heading">
          <h2 id="spotlight-heading">Spotlight</h2>
          <div class="tracks">
            <div class="player-frame">
              <iframe class="player" title="Strangers by 534N UK on SoundCloud" width="100%" height="200" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/534nuk/strangers&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=false&amp;visual=true"></iframe>
            </div>
            <div class="player-frame">
              <iframe class="player" title="Torn by 534N UK on SoundCloud" width="100%" height="200" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/534nuk/torn&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=false&amp;visual=true"></iframe>
            </div>
            <div class="player-frame">
              <iframe class="player" title="End of the UK by 534N UK on SoundCloud" width="100%" height="200" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/534nuk/uk-end&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=false&amp;visual=true"></iframe>
            </div>
            <div class="player-frame">
              <iframe class="player" title="Got You by 534N UK on SoundCloud" width="100%" height="200" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/534nuk/got-you&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=false&amp;visual=true"></iframe>
            </div>
            <div class="player-frame">
              <iframe class="player" title="BOOM by 534N UK on SoundCloud" width="100%" height="200" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/534nuk/boom&amp;color=%23ff5500&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=true&amp;show_reposts=false&amp;show_teaser=false&amp;visual=true"></iframe>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
